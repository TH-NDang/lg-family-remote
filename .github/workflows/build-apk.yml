name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', '.github/dependabot.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK to Releases (preview if no signing secret)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test, lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Provision Android command-line tools
        uses: android-actions/setup-android@v4.0.4
        with:
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Unit tests, lint and preview APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Prepare optional release signing
        id: signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: python3 scripts/prepare_signing.py
      - name: Build signed family APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon --stacktrace lintRelease assembleRelease
      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/preview
          cp app/build/outputs/apk/debug/app-debug.apk out/preview/lg-family-remote-preview.apk
          (cd out/preview && sha256sum *.apk > SHA256SUMS.txt)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mkdir -p out/release
            cp app/build/outputs/apk/release/app-release.apk out/release/lg-family-remote-v0.3.3.apk
            (cd out/release && sha256sum *.apk > SHA256SUMS.txt)
          fi
      - name: Upload preview APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: preview-apk
          path: out/preview/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload signed family APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-family-apk
          path: out/release/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish installable APK
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.ready }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="preview-${GITHUB_RUN_NUMBER}"
          DIR=out/preview
          TITLE="Điều khiển TV 0.3.3 · bản thử #${GITHUB_RUN_NUMBER}"
          if [ "$SIGNED" = true ]; then
            TAG="family-${GITHUB_RUN_NUMBER}"
            DIR=out/release
            TITLE="Điều khiển TV 0.3.3 · bản ký riêng #${GITHUB_RUN_NUMBER}"
          fi
          {
            echo '# Điều khiển TV 0.3.3'
            echo
            echo 'Mới: hỗ trợ PIN pairing: TV hiện mã → nhập trên điện thoại → lưu client-key → lần sau tự kết nối.'
            echo 'Tìm kiếm bằng mic được đổi sang YouTube deep-link: nói xong mở thẳng trang kết quả YouTube.'
            echo 'Không còn phụ thuộc ô nhập đang focus trên TV và không cần CONTROL_INPUT_TEXT.'
            echo 'Dùng adaptive icon trên Android mới và vector fallback cho Android cũ.'
            echo 'Hàng đợi xử lý tuần tự, bỏ thao tác cũ khi quá tải và xóa khi đổi phiên/kích hoạt nguồn.'
            echo 'Nút nguồn một chạm: đang kết nối = tắt, chưa kết nối = bật; không có hộp xác nhận.'
            echo 'Nút nguồn trên header được tăng lên 64dp, icon 36dp và có nền đỏ nhạt để dễ nhìn/dễ bấm.'
            echo 'Nút âm lượng có icon loa lớn kèm dấu −/+ nổi bật để dễ nhận biết.'
            echo 'Điều hướng đổi sang D-pad tròn; thêm chế độ bàn phím điện thoại và touchpad rê chuột.'
            echo 'Khi TV focus ô nhập, app tự hiện vùng nhập và gọi bàn phím Android.'
            echo 'Reconnect ổn định hơn: nếu IP TV đổi do DHCP, app tự tìm lại TV theo UID/SSDP và lưu IP mới.'
            echo 'Chuẩn hóa UID uuid:/urn:uuid:/USN để không bỏ sót đúng TV đã ghép.'
            echo 'Sau Wake-on-LAN, app giữ trạng thái đang bật và tự thử kết nối nhanh trong tối đa khoảng 90 giây.'
            echo 'Không chuyển chấm sang xám giữa các lần thử khi TV vẫn đang khởi động.'
            echo 'Trạng thái kết nối chỉ còn chấm nhỏ trên header; thiết lập nằm trong bánh răng.'
            echo 'Sửa đọc MAC trên LG dùng wifiInfo/wiredInfo; vẫn hỗ trợ wifi/wired cũ.'
            echo 'Wake-on-LAN gửi broadcast + directed broadcast + unicast qua UDP 9 và 7.'
            echo 'Trước khi tắt, nếu chưa có MAC app sẽ lấy/lưu MAC trước; thất bại thì không tắt để tránh bị kẹt.'
            echo
            echo 'Android 8 trở lên. Cùng mạng nhà → chọn tivi LG webOS → chọn Cho phép trên tivi.'
            echo 'Nếu tivi yêu cầu quyền nguồn mới: Cài đặt → Nhập IP / tùy chọn → Ghép đôi lại.'
            echo 'Người dùng đã xác nhận bản 0.1.0 hoạt động; chức năng nguồn 0.3.3 cần thử trên tivi thực tế.'
            if [ "$SIGNED" != true ]; then
              echo 'Bản thử dùng khóa debug tạm; nếu không cập nhật đè được, cần gỡ bản thử cũ và ghép đôi lại.'
              echo 'Bản dùng lâu dài cần ANDROID_SIGNING_BUNDLE. Xem docs/SIGNING.md.'
            fi
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIR"/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$DIR"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TITLE" --prerelease --notes-file release-notes.md
          fi
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Summarize verification
        if: always()
        run: python3 scripts/test_summary.py
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/family-signing"
